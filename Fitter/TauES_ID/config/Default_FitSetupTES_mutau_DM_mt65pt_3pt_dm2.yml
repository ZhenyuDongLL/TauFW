## Config file for default TES and tid SF fit in mutau channel by DM and pt 
## contact: saskia.falke@cern.ch and oceane.poncet@cern.ch
##
## MODIFIED based on discussion to consolidate pt bins and adjust m_vis binning.
# NOTE: In general, the main information (channel, baselineCuts, etc.) should be given.
# More specific sub-options (like weight replacement for systematic uncertainties) are optional


# Typically, each channel will have its own config file; combination can be done at datacard level

channel: mutau


tag: "_test_upart_1204" #"_mutau_mt65_DM_pt_Dt2p5_puppimet"

# baselineCuts: "q_1*q_2<0 && iso_1<0.15 && idDecayModeNewDMs_2 && idDeepTau2018v2p5VSjet_2>=5 && idDeepTau2018v2p5VSe_2>=2 && idDeepTau2018v2p5VSmu_2>=4 && !lepton_vetoes_notau && metfilter && mt_1<65 "
# baselineCuts: "q_1*q_2<0 && iso_1<0.15 && !lepton_vetoes_notau && metfilter && mt_1<65 && rawUParTVSe_2>=0.104 && rawUParTVSjet_2>=0.514 && rawUParTVSmu_2>=0.888 && (decayModeUParT_2==0 || decayModeUParT_2==1 || decayModeUParT_2==2 || decayModeUParT_2==10 || decayModeUParT_2==11 )" # && rawPNetVSjet_2>=0.881 && rawPNetVSe_2>=0.4  && rawPNetVSmu_2>=0.99" # && !idDecayModeNewDMs_2" 
# baselineCuts: "q_1*q_2<0 && iso_1<0.15 && !lepton_vetoes_notau && metfilter && mt_1<65 && rawUParTVSe_2>=0.268 && rawUParTVSjet_2>=0.251 && rawUParTVSmu_2>=0.915 && (decayModeUParT_2==0 || decayModeUParT_2==1 || decayModeUParT_2==2 || decayModeUParT_2==10 || decayModeUParT_2==11 )" # && rawPNetVSjet_2>=0.881 && rawPNetVSe_2>=0.4  && rawPNetVSmu_2>=0.99" # && !idDecayModeNewDMs_2" 
# baselineCuts: "q_1*q_2<0 && iso_1<0.15 && !lepton_vetoes_notau && metfilter && mt_1<65 && rawUParTVSe_2>=0.2343 && rawUParTVSjet_2>=0.2541 && rawUParTVSmu_2>=0.8359 && (decayModeUParT_2==0 || decayModeUParT_2==1 || decayModeUParT_2==2 || decayModeUParT_2==10 || decayModeUParT_2==11 )" # VSe VVL; VSjet M; VSmu T

baselineCuts: "q_1*q_2<0 && iso_1<0.15 && !lepton_vetoes_notau && metfilter && mt_1<65 && rawUParTVSe_2>=0.2343 && rawUParTVSjet_2>=0.2541 && rawUParTVSmu_2>=0.8359" # VSe VVL; VSjet M; VSmu T

# idDeepTau2018v2p5VSjet_2>=5 = Medium WP
# idDeepTau2018v2p5VSe_2>=2 = VVLoose WP
# idDeepTau2018v2p5VSmu_2>=4 = Tight WP


# These regions will be defined when creating inputs or making plots
# At this point, they do not need to be exclusive; 
# PLEASE NOTE:
#     - which regions are included in the fit will be defined in obervables section --> adjust when changing regions
#     - additional cross section scale factors applied to some processes need to be given in these regions to be considered --> adjust in scaleFactors section

regions:
    DM0:
       definition: "decayModeUParT_2==0"
       title: "h^{#pm}"
    DM1:
      definition: "decayModeUParT_2==1"    
      title: "h^{#pm}#pi^{0}"
    DM10:
      definition: "decayModeUParT_2==10"
      title: "h^{#pm}h^{#mp}h^{#pm}"
    DM11:
      definition: "decayModeUParT_2==11"
      title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}"    
    DM2:
      definition: "decayModeUParT_2==2"    
      title: "DM2"
    DM0_pt1: 
        definition: "decayModeUParT_2==0 && pt_2>20 && pt_2<40"
        title: "h^{#pm}, pt: 20-40"
    DM0_pt2:
        definition: "decayModeUParT_2==0 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}, pt: 40-60"
    DM0_pt3:
        definition: "decayModeUParT_2==0 && pt_2>=60 && pt_2<200"
        title: "h^{#pm}, pt: 60-200"
    DM1_pt1: 
        definition: "decayModeUParT_2==1 && pt_2>20 && pt_2<40"
        title: "h^{#pm}#pi^{0}, pt: 20-40"
    DM1_pt2:
        definition: "decayModeUParT_2==1 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}#pi^{0}, pt: 40-60"
    DM1_pt3:
        definition: "decayModeUParT_2==1 && pt_2>=60 && pt_2<200"
        title: "h^{#pm}#pi^{0}, pt: 60-200"
    DM10_pt1: 
        definition: "decayModeUParT_2==10 && pt_2>20 && pt_2<40"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 20-40"
    DM10_pt2:
        definition: "decayModeUParT_2==10 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 40-60"
    DM10_pt3:
        definition: "decayModeUParT_2==10 && pt_2>=60 && pt_2<200"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 60-200"
    DM11_pt1: 
        definition: "decayModeUParT_2==11 && pt_2>20 && pt_2<40"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 20-40"
    DM11_pt2:
        definition: "decayModeUParT_2==11 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 40-60"
    DM11_pt3:
        definition: "decayModeUParT_2==11 && pt_2>=60 && pt_2<200"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 60-200"
    DM2_pt1: 
        definition: "decayModeUParT_2==2 && pt_2>20 && pt_2<40"
        title: "DM2, pt: 20-40"
    DM2_pt2:
        definition: "decayModeUParT_2==2 && pt_2>=40 && pt_2<60"
        title: "DM2, pt: 40-60"
    DM2_pt3:
        definition: "decayModeUParT_2==2 && pt_2>=60 && pt_2<200"
        title: "DM2, pt: 60-200"

plottingOrder: ["DM0", "DM1", "DM10", "DM11", "DM2", 
                "DM0_pt1", "DM0_pt2", "DM0_pt3", 
                "DM1_pt1", "DM1_pt2", "DM1_pt3",
                "DM10_pt1", "DM10_pt2", "DM10_pt3", 
                "DM11_pt1", "DM11_pt2", "DM11_pt3", 
                "DM2_pt1", "DM2_pt2", "DM2_pt3",
               ]


# Observable: to be fitted and plotted
# binning: as defined in TH1 (nbins, xmin, xmax)
# regions: (defined separately) to be included in the fit for this observable

observables:
    m_vis:
        binning: [22, 40, 150] # binning=5GeV, range 40-150 GeV
        title: "m_{vis}"
        extra:
            cut: "40<m_vis && m_vis<150"
        # fitRegions: *region_list
        # scanRegions: *region_list
        fitRegions: ["DM0", "DM1", "DM10", "DM11", "DM2", 
                     "DM0_pt1", "DM0_pt2", "DM0_pt3", 
                     "DM1_pt1", "DM1_pt2", "DM1_pt3",
                     "DM10_pt1", "DM10_pt2", "DM10_pt3",
                     "DM11_pt1", "DM11_pt2", "DM11_pt3",
                     "DM2_pt1", "DM2_pt2", "DM2_pt3"] 
        scanRegions: ["DM0", "DM1", "DM10", "DM11", "DM2", 
                      "DM0_pt1", "DM0_pt2", "DM0_pt3", 
                      "DM1_pt1", "DM1_pt2", "DM1_pt3",
                      "DM10_pt1", "DM10_pt2", "DM10_pt3",
                      "DM11_pt1", "DM11_pt2", "DM11_pt3",
                      "DM2_pt1", "DM2_pt2", "DM2_pt3"] 

# Assume that this code is meant to fit TES variations; more options could be added when adding other POIs

TESvariations:
    # Finer scanning step for smoother fit, as per discussion
    # values : [ 0.970, 0.972, 0.974, 0.976, 0.978, 0.980, 0.982, 0.986, 0.988, 0.990, 0.992, 0.994, 0.996, 0.998, 1.000, 1.002, 1.004, 1.006, 1.008, 1.010, 1.012, 1.014, 1.016, 1.018, 1.020, 1.022,1.024, 1.026, 1.028, 1.030] #1.024 0.984
    values : [0.950 ,0.970, 0.980, 0.990, 1.010, 1.020, 1.030,  1.050] 
    processes: ["ZTT"]

# Should add bin-by-bin variations (stat. uncertainties) for signal and backgrounds?

fitSpecs:
    doBBB: doShapes
    signalBBB: True
    backgroundBBB: True


# Samples to be used and association to processes entering analysis
# Possibility to remove or add specific weights / SFs from global weight

samples:
    filename: "$PICODIR/$SAMPLE_$CHANNEL$TAG.root"
    join: ["VV","TT","ST"]
    split:
        DY: [ ["ZTT","genmatch_2==5"], ["ZL","genmatch_2>0 && genmatch_2<5"], ["ZJ","genmatch_2==0"] ]
        TT: [["TTT","genmatch_2==5"], ["TTL","genmatch_2>0 && genmatch_2<5"], ["TTJ","genmatch_2==0"] ]
        #ST: [("STT","genmatch_2==5"),("STJ","genmatch_2<5")]
    rename:
        WJ: "W"
    data: "data_obs"
    removeSFs: ["idweight_2"]

tesRegions:
    DM0:
        title: "DM0"
    DM1:
        title: "DM1"
    DM10:
        title: "DM10"
    DM11:
        title: "DM11"
    DM2:
        title: "DM2"
    DM0_pt1: 
        title: "DM0 20<p_{t_{#tau}}<40"
    DM0_pt2: 
        title: "DM0 40<=p_{t_{#tau}}<60"
    DM0_pt3:
        title: "DM0 60<=p_{t_{#tau}}<200"
    DM1_pt1: 
        title: "DM1 20<p_{t_{#tau}}<40"
    DM1_pt2: 
        title: "DM1 40<=p_{t_{#tau}}<60"
    DM1_pt3:
        title: "DM1 60<=p_{t_{#tau}}<200"
    DM10_pt1: 
        title: "DM10 20<p_{t_{#tau}}<40"
    DM10_pt2: 
        title: "DM10 40<=p_{t_{#tau}}<60"
    DM10_pt3:
        title: "DM10 60<=p_{t_{#tau}}<200"
    DM11_pt1: 
        title: "DM11 20<p_{t_{#tau}}<40"
    DM11_pt2: 
        title: "DM11 40<=p_{t_{#tau}}<60"
    DM11_pt3:
        title: "DM11 60<=p_{t_{#tau}}<200"
    DM2_pt1: 
        title: "DM2 20<p_{t_{#tau}}<40"
    DM2_pt2: 
        title: "DM2 40<=p_{t_{#tau}}<60"
    DM2_pt3:
        title: "DM2 60<=p_{t_{#tau}}<200"

tid_SFRegions:
    DM0:
        title: "DM0"
    DM1:
        title: "DM1"
    DM10:
        title: "DM10"
    DM11:
        title: "DM11"
    DM2:
        title: "DM2"
    DM0_pt1: 
        title: "DM0 20<p_{t_{#tau}}<40"
    DM0_pt2: 
        title: "DM0 40<=p_{t_{#tau}}<60"
    DM0_pt3:
        title: "DM0 60<=p_{t_{#tau}}<200"
    DM1_pt1: 
        title: "DM1 20<p_{t_{#tau}}<40"
    DM1_pt2: 
        title: "DM1 40<=p_{t_{#tau}}<60"
    DM1_pt3:
        title: "DM1 60<=p_{t_{#tau}}<200"
    DM10_pt1: 
        title: "DM10 20<p_{t_{#tau}}<40"
    DM10_pt2: 
        title: "DM10 40<=p_{t_{#tau}}<60"
    DM10_pt3:
